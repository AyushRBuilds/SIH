# ============================================================
# SIH 2026 Food Traceability — Five-Organization Fabric Network
# Fabric Version: 2.5 LTS
# ============================================================
# crypto-config.yaml
# Used by: cryptogen generate --config=./crypto-config.yaml
# ============================================================

OrdererOrgs:
  - Name: Orderer
    Domain: example.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        SANS:
          - localhost
          - 127.0.0.1

PeerOrgs:
  # 1. Regulatory Department — validates, blocks, recalls
  - Name: RegulatoryDepartment
    Domain: regulatorydepartment.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  # 2. Producer — registers products and batches (e.g. GreenValley Farm)
  - Name: Producer
    Domain: producer.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  # 3. Manufacturer — processes batches, creates transformations
  - Name: Manufacturer
    Domain: manufacturer.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  # 4. Deliverer — receives and transfers custody (logistics)
  - Name: Deliverer
    Domain: deliverer.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  # 5. Retailer — receives final batch, makes available, creates units
  - Name: Retailer
    Domain: retailer.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1
